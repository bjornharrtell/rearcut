[package]
name = "rearcut"
version = "1.0.1"
edition = "2024"
description = "A Rust port of mapbox/earcut - a fast, small, dependency-free polygon triangulation library"
license = "ISC"
repository = "https://github.com/bjornharrtell/rearcut"
readme = "README.md"
keywords = ["triangulation", "polygon", "earcut", "geometry", "tessellation"]
categories = ["algorithms", "graphics"]

[lib]
name = "rearcut"
path = "src/lib.rs"

[dependencies]

[build-dependencies]
cc = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }
lyon = "1.0"
earcut = "0.4.11"

[features]
# Compiles and links the vendored mapbox/earcut.hpp (via cpp/earcut_ffi.cpp) so the
# `triangulate` benchmark can also compare against the reference C++ implementation.
# Off by default so building/testing `rearcut` never requires a C++ toolchain.
earcut-hpp = []

[[bench]]
name = "triangulate"
harness = false

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
